<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>متجر الجبة الجزائرية</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #faf7f2;
      color: #222;
    }

    header {
      background: #6b1f2a;
      color: white;
      text-align: center;
      padding: 28px 16px;
    }

    header h1 {
      margin: 0 0 8px;
    }

    .products {
      max-width: 500px;
      margin: auto;
      padding: 24px 16px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    .product {
      background: white;
      border-radius: 14px;
      padding: 12px;
      text-align: center;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
    }

    .product img {
      width: 100%;
      height: 400px;
      object-fit: cover;
      border-radius: 10px;
    }

    .product h2 {
      font-size: 20px;
      margin: 12px 0 6px;
    }

    .product p {
      font-weight: bold;
      color: #6b1f2a;
    }

    .btn {
      display: inline-block;
      background: #25D366;
      color: white;
      padding: 10px 18px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      margin-top: 8px;
    }

    .btn:hover {
      background: #1ebe5d;
    }

    footer {
      background: #222;
      color: white;
      text-align: center;
      padding: 18px;
      margin-top: 30px;
    }
  </style>
</head>
<body>

  <header>
    <h1>متجر الجبة الجزائرية</h1>
    <p>توصيل لكل الولايات</p>
  </header>

  <main class="products">

    <!-- منتج 1 -->
    <div class="product">
      <img src="صور/jebba-1.jpg.jpeg" alt="جبة">
      <h2>جبة عصرية</h2>
      <p>السعر عند التواصل</p>
      <a class="btn" 
         href="https://wa.me/213550109390?text=مرحبا،%20أريد%20طلب%20جبة" 
         target="_blank">
         اطلب عبر واتساب
      </a>
    </div>

  </main>

  <footer>
    <p>© 2025 متجر الجبة — جميع الحقوق محفوظة</p>
  </footer>

</body>
</html>
